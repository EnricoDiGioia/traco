<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Traço</title>
<meta name="description" content="Caderno de anotações à mão para iPhone e iPad, com Apple Pencil.">
<meta name="theme-color" content="#2443D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Traço">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>

    <symbol id="i-front" viewBox="0 0 24 24"><rect x="4" y="4" width="11" height="11" rx="1.6"/><rect x="9" y="9" width="11" height="11" rx="1.6" fill="currentColor" fill-opacity=".28"/></symbol>
    <symbol id="i-backward" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1.6"/><rect x="4" y="4" width="11" height="11" rx="1.6" fill="currentColor" fill-opacity=".28"/></symbol>

<!-- ===== Biblioteca ===== -->
<section id="library" class="view" aria-label="Seus cadernos">
  <header class="lib-head">
    <div class="brand"><span class="wordmark">Traço</span><span class="brand-sub">cadernos</span></div>
    <div class="lib-actions">
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input id="libSearch" type="search" placeholder="Buscar caderno" autocomplete="off" aria-label="Buscar caderno"></label>
      <button id="btnLibImport" class="btn ghost" type="button" title="Importar um PDF para anotar ou um arquivo do Traço"><svg class="ic" aria-hidden="true"><use href="#i-import"/></svg><span>Importar PDF ou caderno</span></button>
      <button id="btnNewNb" class="btn primary" type="button"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span>Novo caderno</span></button>
    </div>
  </header>
  <div id="storageWarn" class="warn" hidden></div>
  <main id="libGrid" class="lib-grid" aria-live="polite"></main>
  <footer class="lib-foot">
    <p>Suas notas ficam guardadas neste aparelho. Para levar para outro aparelho ou fazer backup, exporte o arquivo do caderno.</p>
    <button id="btnBackupAll" class="btn ghost small" type="button"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg><span>Backup de todos</span></button>
  </footer>
</section>

<!-- ===== Editor ===== -->
<section id="editor" class="view" hidden aria-label="Caderno aberto">
  <header class="topbar">
    <button id="btnBack" class="icon-btn" type="button" aria-label="Voltar para os cadernos" title="Cadernos"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
    <input id="nbTitle" class="title-input" type="text" aria-label="Nome do caderno" spellcheck="false" autocomplete="off">
    <span id="saveState" class="save-state" aria-live="polite"></span>
    <div class="topbar-actions">
      <button id="btnUndo" class="icon-btn" type="button" aria-label="Desfazer" title="Desfazer (⌘Z)"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg></button>
      <button id="btnRedo" class="icon-btn" type="button" aria-label="Refazer" title="Refazer (⇧⌘Z)"><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg></button>
      <span class="tb-sep wide-only"></span>
      <button id="btnPages" class="icon-btn wide-only" type="button" aria-label="Páginas" title="Páginas"><svg class="ic" aria-hidden="true"><use href="#i-pages"/></svg></button>
      <button id="btnInsert" class="icon-btn" type="button" aria-label="Inserir" title="Inserir imagem, figurinha ou página"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
      <button id="btnExport" class="icon-btn wide-only" type="button" aria-label="Exportar" title="Exportar"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg></button>
      <button id="btnMore" class="icon-btn" type="button" aria-label="Mais opções" title="Mais opções"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
    </div>
  </header>

  <div id="toolbar" class="toolbar">
    <div class="tools" role="toolbar" aria-label="Ferramentas">
      <button class="tool" type="button" data-tool="pen" aria-label="Caneta" title="Caneta (P)"><svg class="ic" aria-hidden="true"><use href="#i-pen"/></svg><span class="tip"></span></button>
      <button class="tool" type="button" data-tool="pencil" aria-label="Lápis" title="Lápis (L)"><svg class="ic" aria-hidden="true"><use href="#i-pencil"/></svg><span class="tip"></span></button>
      <button class="tool" type="button" data-tool="hl" aria-label="Marca-texto" title="Marca-texto (M)"><svg class="ic" aria-hidden="true"><use href="#i-hl"/></svg><span class="tip"></span></button>
      <button class="tool" type="button" data-tool="eraser" aria-label="Borracha" title="Borracha (E)"><svg class="ic" aria-hidden="true"><use href="#i-eraser"/></svg></button>
      <button class="tool" type="button" data-tool="lasso" aria-label="Laço: selecionar e mover" title="Laço (S)"><svg class="ic" aria-hidden="true"><use href="#i-lasso"/></svg></button>
      <button class="tool" type="button" data-tool="text" aria-label="Texto" title="Texto (T)"><svg class="ic" aria-hidden="true"><use href="#i-text"/></svg></button>
      <button class="tool" type="button" data-tool="laser" aria-label="Laser" title="Laser"><svg class="ic" aria-hidden="true"><use href="#i-laser"/></svg></button>
    </div>
    <div class="tb-divider" aria-hidden="true"></div>
    <div id="toolOpts" class="tool-opts"></div>
  </div>

  <main id="stage" class="stage">
    <canvas id="cvBase"></canvas>
    <canvas id="cvLive"></canvas>
    <textarea id="textEditor" class="text-editor" hidden spellcheck="true" aria-label="Texto da caixa"></textarea>
    <div id="selMenu" class="sel-menu" hidden role="toolbar" aria-label="Seleção"></div>
    <div id="zoomBadge" class="zoom-badge" hidden></div>
    <nav class="pagenav" aria-label="Navegação de páginas">
      <button id="btnPrev" class="icon-btn" type="button" aria-label="Página anterior"><svg class="ic" aria-hidden="true"><use href="#i-chev-l"/></svg></button>
      <button id="pageLabel" class="page-label" type="button" aria-label="Ver todas as páginas">1 / 1</button>
      <button id="btnNext" class="icon-btn" type="button" aria-label="Próxima página"><svg class="ic" aria-hidden="true"><use href="#i-chev-r"/></svg></button>
      <button id="btnAddPage" class="icon-btn" type="button" aria-label="Adicionar página depois desta" title="Nova página"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
    </nav>
  </main>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/store.js"></script>
<script src="js/ink.js"></script>
<script src="js/app.js"></script>
</body>
</html>
